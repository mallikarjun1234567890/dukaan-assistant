services:
  backend:
    build:
      context: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or a local .env file}
      DATABASE_URL: sqlite:////app/data/dukaan.db
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      SHOP_TIMEZONE: Asia/Kolkata
      DEBUG: "false"
    volumes:
      - dukaan-data:/app/data
    ports:
      - "8000:8000"

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dukaan
      POSTGRES_PASSWORD: dukaan
      POSTGRES_DB: dukaan
    ports:
      - "5432:5432"
    volumes:
      - dukaan-pg:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dukaan-data:
  dukaan-pg:
